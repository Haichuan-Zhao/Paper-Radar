name: Release skill

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: paper-radar-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Package public skill files
        id: bundle
        shell: python
        run: |
          import hashlib, json, os, re, zipfile
          from pathlib import Path

          root = Path('.agents/skills/paper-radar')
          names = ['LICENSE', 'SKILL.md', 'agents/openai.yaml']
          paths = [Path('.agents'), root.parent, root, *root.rglob('*')]
          if any(p.is_symlink() for p in paths) or {
              p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()
          } != set(names):
              raise SystemExit('Skill directory must contain only the three public files.')
          header = re.match(r'\A---\n(.*?)\n---\n', (root / 'SKILL.md').read_text(), re.S)
          versions = re.findall(r'^  version: "((?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*))"$', header[1] if header else '', re.M)
          if len(versions) != 1:
              raise SystemExit('A single metadata.version is required.')
          version = versions[0]
          if (root / 'LICENSE').read_bytes() != Path('LICENSE').read_bytes():
              raise SystemExit('MIT licenses must match.')
          output = Path('dist')
          output.mkdir(exist_ok=True)
          entries = []
          with zipfile.ZipFile(output / 'paper-radar.zip', 'w') as archive:
              for name in names:
                  data = (root / name).read_bytes()
                  target = 'paper-radar/' + name
                  info = zipfile.ZipInfo(target)
                  info.create_system = 3
                  info.external_attr = 0o100644 << 16
                  archive.writestr(info, data)
                  entries.append({'path': target, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
          data = (output / 'paper-radar.zip').read_bytes()
          manifest = {
              'skill': 'paper-radar', 'version': version, 'tag': 'v' + version,
              'repository': 'https://github.com/Haichuan-Zhao/Paper-Radar',
              'protocol': 'paper-radar-v2', 'rubric': 'paper-content-v2', 'runtime': 'host-agent',
              'archive': {'file': 'paper-radar.zip', 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()},
              'files': entries,
          }
          (output / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as result:
              result.write('tag=v' + version + '\n')
      - name: Publish versioned skill
        env:
          GH_TOKEN: ${{ github.token }}
          PAPER_RADAR_TAG: ${{ steps.bundle.outputs.tag }}
        run: >-
          gh release create "$PAPER_RADAR_TAG" dist/paper-radar.zip dist/manifest.json
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title "Paper-Radar $PAPER_RADAR_TAG" --generate-notes
