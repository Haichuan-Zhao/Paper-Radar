name: Validate and package skill

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: node --version
      - run: node --test tests/package.test.mjs
      - run: node scripts/check-skill.mjs
      - run: node scripts/package-skill.mjs
      - run: unzip -t dist/research-radar.zip
