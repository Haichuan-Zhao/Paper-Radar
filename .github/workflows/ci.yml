name: Check and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: node --test tests/package.test.mjs
      - run: node scripts/package-skill.mjs
      - run: unzip -t dist/paper-radar.zip

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: paper-radar-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: bundle
        run: node scripts/package-skill.mjs
      - name: Publish versioned skill
        env:
          GH_TOKEN: ${{ github.token }}
          PAPER_RADAR_TAG: ${{ steps.bundle.outputs.tag }}
        run: >-
          gh release create "$PAPER_RADAR_TAG" dist/paper-radar.zip dist/manifest.json
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title "Paper-Radar $PAPER_RADAR_TAG" --generate-notes
